name: Tag current version and bump

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  versioning:
    # Skip merges of the bump PR itself, otherwise each bump would trigger another one.
    if: "!contains(github.event.head_commit.message, 'chore: bump version')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read current version
        id: current
        run: |
          VERSION_LINE=$(grep '^version:' pubspec.yaml)
          VERSION=${VERSION_LINE#version: }
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create git tag from current version
        run: |
          TAG="v${{ steps.current.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::notice::Tag $TAG already exists, skipping"
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Bump patch version
        id: bump
        run: |
          VERSION="${{ steps.current.outputs.version }}"

          BASE_VERSION=$(echo $VERSION | cut -d'+' -f1)
          BUILD=$(echo $VERSION | cut -s -d'+' -f2)

          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"
          PATCH=$((PATCH + 1))

          if [ -z "$BUILD" ]; then
            NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          else
            BUILD=$((BUILD + 1))
            NEW_VERSION="$MAJOR.$MINOR.$PATCH+$BUILD"
          fi

          sed -i "s/^version:.*/version: $NEW_VERSION/" pubspec.yaml
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      # main is protected by a ruleset that requires pull requests,
      # so the bump goes through a PR instead of a direct push.
      - name: Open pull request with bumped version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
        run: |
          BRANCH="chore/bump-version-$NEW_VERSION"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -b "$BRANCH"
          git add pubspec.yaml
          git commit -m "chore: bump version to $NEW_VERSION"
          git push --force origin "$BRANCH"

          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number -q '.[].number')" ]; then
            echo "::notice::PR for $BRANCH already open, branch updated"
          else
            gh pr create --base main --head "$BRANCH" \
              --title "chore: bump version to $NEW_VERSION" \
              --body "Automatic version bump after tagging v${{ steps.current.outputs.version }}."
          fi
